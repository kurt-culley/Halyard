name: halyard
description: Tuning and data tool for the ME360 ECU. Flutter app.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  halyard_core:
    path: ../core
  provider: ^6.1.5+1
  auto_route: ^11.2.0
  file_selector: ^1.1.0
  web: ^1.1.2
  flutter_libserialport: ^0.6.0
  path_provider: ^2.1.6

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
