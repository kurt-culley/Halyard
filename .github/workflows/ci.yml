name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Analyze core
        run: dart analyze --fatal-infos
        working-directory: core
      - name: Analyze app
        run: dart analyze --fatal-infos
        working-directory: app
      - name: Format
        run: dart format --set-exit-if-changed core app/lib app/test
      - name: Core tests (VM)
        run: dart test
        working-directory: core
      - name: Core tests (Chrome)
        run: dart test -p chrome
        working-directory: core
      - name: App tests
        run: flutter test
        working-directory: app
      - name: App tests (Chrome)
        run: flutter test --platform chrome test/platform
        working-directory: app
      - name: Import and folder rules
        run: dart run tool/check_imports.dart
      - name: Branding
        run: dart run tool/check_branding.dart
