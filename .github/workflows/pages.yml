name: Pages

# Publishes the web app to GitHub Pages on every push to main, with our synthetic sample definition beside it at
# demo.medef. It holds no vendor files: real definitions stay with the user and are added in the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
      - run: flutter pub get
      - name: Build
        run: flutter build web --release --base-href /Halyard/ --no-web-resources-cdn
        working-directory: app
      - name: Sample definition
        # Our own synthetic definition, so the demo can be tried without a car. It describes no real ECU.
        run: node tool/demo_definition.mjs > app/build/web/demo.medef
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
